<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character master — Kritesh</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#F1ECE2; --ink:#171717; --red:#A31C1B; --green:#06110C; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { padding:24px 20px 0; }
  h1 { font:600 13px/1 ui-monospace, monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--red); margin:0 0 6px; }
  p { margin:0; max-width:60ch; color:#555; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; padding:20px; }
  figure { margin:0; background:#fff; border:1px solid #ddd5c6; }
  figcaption { font:600 11px/1 ui-monospace, monospace; letter-spacing:.14em; text-transform:uppercase; padding:10px; border-top:1px solid #eee5d6; }
  svg { display:block; width:100%; height:auto; }
  .wide { grid-column: span 2; }
  .ref img { width:100%; height:300px; object-fit:cover; object-position:50% 30%; display:block; }
</style>
</head>
<body>
<header>
  <h1>Character master // locked</h1>
  <p>One rig, many angles. Every scene in the story uses these exact shapes, so the face cannot drift between chapters.</p>
</header>
<div class="grid" id="grid"></div>
<script type="module">
  import { createCharacter } from './js/char/character.js';
  const NS = 'http://www.w3.org/2000/svg';
  const grid = document.getElementById('grid');
  const all = [];
  function cell(label, vb, setup, wide) {
    const fig = document.createElement('figure');
    if (wide) fig.className = 'wide';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', vb);
    const ch = createCharacter(setup.opts || {});
    svg.appendChild(ch.el);
    setup.after && setup.after(ch);
    fig.appendChild(svg);
    const cap = document.createElement('figcaption'); cap.textContent = label; fig.appendChild(cap);
    grid.appendChild(fig);
    all.push(ch);
  }
  const full = '-260 -900 520 940';
  cell('Front', full, { opts: { turn: 0, outfit: 'tee' } });
  cell('3/4', full, { opts: { turn: 0.5, outfit: 'tee' } });
  cell('Side', full, { opts: { turn: 0.9, outfit: 'tee', pose: 'relaxed' } });
  cell('Back', full, { opts: { turn: 0, outfit: 'layers', view: 'back' } });
  cell('Face close-up', '-75 -870 150 190', { opts: { turn: 0.15 } });
  const ex = ['neutral', 'focused', 'smile', 'tired', 'determined', 'thinking'];
  ex.forEach((e) => cell(e, '-75 -870 150 190', { opts: { turn: 0.3, expr: e } }));
  cell('Outfit // US layers', full, { opts: { turn: 0.4, outfit: 'layers' } });
  cell('Outfit // now', full, { opts: { turn: 0.4, outfit: 'black', pose: 'phone' } });
  cell('Seated // typing', '-300 -720 600 760', { opts: { turn: 0.6, outfit: 'black', pose: 'type' } });
  cell('Walk', full, { opts: { turn: 0.7, outfit: 'layers' }, after: (c) => c.walk(true) });
  let last = performance.now();
  const still = new URLSearchParams(location.search).has('still');
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    all.forEach((c) => c.update(still ? 0.3 : dt));
    if (!still) requestAnimationFrame(loop);
  }
  if (still) { for (let i = 0; i < 40; i++) all.forEach((c) => { c.state.nextBlink = 99; c.update(0.05); }); document.body.dataset.ready = 1; }
  else requestAnimationFrame(loop);
</script>
</body>
</html>
